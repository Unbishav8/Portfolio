name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write   # needed to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install and build
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo -n "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          echo "$P" | base64 -d | jq '{sub, aud, repository, ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Upload to S3
        working-directory: app
        run: aws s3 sync dist/ s3://${{ vars.BUCKET_NAME }} --delete

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.DISTRIBUTION_ID }} --paths "/*"